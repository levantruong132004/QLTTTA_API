# Sao chép file này sang thư mục cấu hình cloudflared của user:
#   C:\Users\<user>\.cloudflared\config.yml
# Và cập nhật các giá trị bên dưới cho phù hợp.

# UUID của tunnel sau khi chạy: cloudflared tunnel create <name>
tunnel: YOUR_TUNNEL_UUID_HERE

# Đường dẫn đến file credentials tương ứng với UUID ở trên
credentials-file: C:\\Users\\<user>\\.cloudflared\\YOUR_TUNNEL_UUID_HERE.json

ingress:
  # Subdomain bạn muốn dùng (đã/được tạo qua lệnh `cloudflared tunnel route dns`)
  - hostname: web.example.com
    # Ứng dụng cục bộ cần publish (đổi port cho phù hợp)
    service: http://localhost:5165

  # Mặc định trả 404 cho các route khác
  - service: http_status:404
